---
title: Interface
description: A few defaults that most people change by hand on a new installation. No effect on performance is claimed.
actions:
  # File name extensions are shown (you see that "game.exe" is a program and "photo.jpg.exe" is not a photo).
  - !registryValue: {path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced', value: 'HideFileExt', data: '0', type: REG_DWORD, errorAction: Log}
  # Explorer opens on "This PC".
  - !registryValue: {path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced', value: 'LaunchTo', data: '1', type: REG_DWORD, errorAction: Log}
  # Taskbar. With "Clean taskbar" (on by default) only the Start button stays: no search, Task view or Chat button,
  # and every pinned program is unpinned (Set-Taskbar.ps1 in software.yml). Without it, search becomes an icon.
  - !registryValue: {path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Search', value: 'SearchboxTaskbarMode', data: '0', type: REG_DWORD, option: 'taskbar-clean', errorAction: Log}
  - !registryValue: {path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Search', value: 'SearchboxTaskbarMode', data: '1', type: REG_DWORD, option: '!taskbar-clean', errorAction: Log}
  - !registryValue: {path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced', value: 'ShowTaskViewButton', data: '0', type: REG_DWORD, option: 'taskbar-clean', errorAction: Log}
  - !registryValue: {path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced', value: 'TaskbarMn', data: '0', type: REG_DWORD, option: 'taskbar-clean', errorAction: Log}

  # Dark theme for Windows and for apps (Settings → Personalization → Colors). Option, on by default.
  - !registryValue: {path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize', value: 'AppsUseLightTheme', data: '0', type: REG_DWORD, option: 'ui-dark', errorAction: Log}
  - !registryValue: {path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize', value: 'SystemUsesLightTheme', data: '0', type: REG_DWORD, option: 'ui-dark', errorAction: Log}

  # Notifications off (Settings → System → Notifications, the main switch): no pop-ups and no sounds over a game.
  # Defender keeps protecting; its state stays visible in Windows Security. Turn the switch back on in Settings at any time.
  - !registryValue: {path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\PushNotifications', value: 'ToastEnabled', data: '0', type: REG_DWORD, option: 'ui-no-notifications', errorAction: Log}

  # Administrator prompts: the account stays an administrator and UAC stays on, but a program that asks for
  # administrator rights gets them without the "Do you want to allow this app to make changes?" window
  # (Settings → UAC slider "Never notify" for administrators). Store apps, Xbox and anti-cheats keep working.
  # Any program you start that asks for rights now gets them silently. Option, OFF by default since 2.1.9 (a silent
  # elevation is a real security cost); Undo restores the prompt.
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System', value: 'ConsentPromptBehaviorAdmin', data: '0', type: REG_DWORD, option: 'uac-no-prompt', errorAction: Log}
  # Option not ticked: the prompt is Windows' default again (3 = ask for consent for Windows programs). Versions up to
  # 2.1.8 ticked it by default, so an update without the tick brings the prompt back.
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System', value: 'ConsentPromptBehaviorAdmin', data: '3', type: REG_DWORD, option: '!uac-no-prompt', errorAction: Log}

  # "End task" in the taskbar's right-click menu (Settings > System > For developers): a frozen game is closed in two clicks.
  - !registryValue: {path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced\TaskbarDeveloperSettings', value: 'TaskbarEndTask', data: '1', type: REG_DWORD, errorAction: Log}
  # A blue screen shows its stop code and parameters: helps to find the driver that crashed when you ask for help.
  - !registryValue: {path: 'HKLM\SYSTEM\CurrentControlSet\Control\CrashControl', value: 'DisplayParameters', data: '1', type: REG_DWORD, errorAction: Log}

  # Right-click menu: the full menu opens at once (7-Zip, "Open with", "Send to" and the rest), without "Show more
  # options" first. Same as Windows 10. Undo removes the switch and brings back the Windows 11 menu. Takes effect
  # after the restart at the end of the install.
  - !registryValue: {path: 'HKCU\Software\Classes\CLSID\{86ca1aa0-34aa-4e8b-a509-50c905bae2a2}\InprocServer32', value: '', data: '', type: REG_SZ, errorAction: Log}
