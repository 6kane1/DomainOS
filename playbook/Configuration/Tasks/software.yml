---
title: Domain OS tools
description: Installs the runtimes games expect, registers DomainScheduler to start with Windows and shows "What's new" once after the restart. The tools themselves (Undo Domain OS and the rest) are copied first, in main.yml, right after the state is saved.
actions:
  # Every !run below starts one of our scripts: exit code 0 = done or nothing to do, anything else stops the install
  # (handleExitCodes), except Install-Runtimes (explained there). The reason is in %ProgramData%\Domain OS\Logs.
  - !writeStatus: {status: 'Installing Visual C++, DirectX and 7-Zip', option: 'install-runtimes'}
  - !run:
    exe: '%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe'
    args: '-NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\Install-Runtimes.ps1"'
    exeDir: true
    wait: true
    weight: 60
    option: 'install-runtimes'
    # The one exception to "stop on an error": downloads from the vendors can fail for reasons outside the PC (a server
    # or the connection), each part is independent, and the step can be run again any time (Start > Domain OS >
    # Install runtimes). Failures are written to runtimes.log and shown as warnings by "Check Domain OS".
    errorAction: Log

  - !writeStatus: {status: 'Installing the Domain OS app', option: 'install-scheduler'}
  - !run:
    exe: '%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe'
    args: '-NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\Install-DomainOS.ps1" -Part Scheduler'
    exeDir: true
    wait: true
    weight: 10
    option: 'install-scheduler'
    handleExitCodes: {'!0': Halt}

  # "What's new in Domain OS" (Guide\whats-new.html) opens once at the next sign-in, after every install, so an update
  # shows what changed (scheduled task at sign-in, normal rights). Also in Start > Domain OS. Since 2.3.5 this is the only
  # page that opens by itself: the driver guide no longer opens after the install (owner's decision); it stays in
  # Start > Domain OS > "First steps (drivers)".
  - !run:
    exe: '%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe'
    args: '-NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\Install-DomainOS.ps1" -Part WhatsNew'
    runas: currentUserElevated
    exeDir: true
    wait: true
    weight: 1
    handleExitCodes: {'!0': Halt}

  # The Domain OS wallpapers: a desktop slideshow and one picture on the lock screen, for the installing account.
  # Ordinary settings (no policy is set): the user can change both in Settings at any time; the earlier look is saved
  # and "Undo Domain OS" puts it back. Lock screen slideshow: Settings > Personalization > Lock screen > Slideshow.
  - !writeStatus: {status: 'Setting the Domain OS wallpapers', option: 'wallpaper'}
  - !run:
    exe: '%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe'
    args: '-NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\Set-Wallpapers.ps1"'
    runas: currentUserElevated
    exeDir: true
    wait: true
    weight: 2
    option: 'wallpaper'
    handleExitCodes: {'!0': Halt}

  # The "Domain OS" power plan: a copy of Balanced with USB selective suspend and PCIe ASPM off, display and disk never
  # turned off (the display setting is a convenience, not a performance setting; OLED owners may want a timeout).
  - !writeStatus: {status: 'Creating the Domain OS power plan', option: 'power-plan'}
  - !run:
    exe: '%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe'
    args: '-NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\Set-PowerPlan.ps1"'
    exeDir: true
    wait: true
    weight: 3
    option: 'power-plan'
    handleExitCodes: {'!0': Halt}

  # What is left of the removed apps (entries without an icon named "ms-resource:...", or Teams/Outlook/Copilot
  # registered again for the signed-in account) is removed, and checked once more at the next sign-in.
  - !writeStatus: {status: 'Cleaning the Start menu of removed apps', option: 'apps-basic'}
  - !run:
    exe: '%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe'
    args: '-NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\Remove-AppLeftovers.ps1"'
    runas: currentUserElevated
    exeDir: true
    wait: true
    weight: 3
    option: 'apps-basic'
    handleExitCodes: {'!0': Halt}
  - !run:
    exe: '%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe'
    args: '-NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\Remove-AppLeftovers.ps1" -Max'
    runas: currentUserElevated
    exeDir: true
    wait: true
    weight: 2
    option: 'apps-max'
    handleExitCodes: {'!0': Halt}

  # Start menu pins rebuilt from installed programs (the tiles of removed apps disappear). First install only.
  - !run:
    exe: '%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe'
    args: '-NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\Set-StartPins.ps1"'
    runas: currentUserElevated
    exeDir: true
    wait: true
    weight: 2
    option: 'apps-basic'
    handleExitCodes: {'!0': Halt}

  # Unpins every program from the taskbar (as the signed-in user; the original pins are kept for Undo).
  # Runs last: the taskbar blinks once while Explorer of this session restarts (Windows starts it again as the user).
  - !run:
    exe: '%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe'
    args: '-NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\Set-Taskbar.ps1"'
    runas: currentUserElevated
    exeDir: true
    wait: true
    weight: 3
    option: 'taskbar-clean'
    handleExitCodes: {'!0': Halt}
