---
title: Preinstalled apps
description: Removes apps that run in the background or advertise and that a gaming PC does not need. The Store, Xbox services and Edge stay.
actions:
  # ---- basic list: nothing here is needed by games, drivers or anti-cheats -------------------------
  - !appx: {name: 'Clipchamp.Clipchamp*', type: family, option: 'apps-basic'}                 # video editor (advertised)
  - !appx: {name: 'Microsoft.BingNews*', type: family, option: 'apps-basic'}                  # news feed
  - !appx: {name: 'Microsoft.BingWeather*', type: family, option: 'apps-basic'}               # weather
  - !appx: {name: 'Microsoft.BingSearch*', type: family, option: 'apps-basic'}                # web results in Start
  - !appx: {name: 'Microsoft.MicrosoftSolitaireCollection*', type: family, option: 'apps-basic'}
  - !appx: {name: 'MSTeams*', type: family, option: 'apps-basic'}                             # Teams (starts with Windows)
  - !appx: {name: 'MicrosoftTeams*', type: family, option: 'apps-basic'}
  - !appx: {name: 'Microsoft.Copilot*', type: family, option: 'apps-basic'}                   # Copilot app
  - !appx: {name: 'Microsoft.OutlookForWindows*', type: family, option: 'apps-basic'}         # new Outlook
  - !appx: {name: 'Microsoft.Windows.DevHome*', type: family, option: 'apps-basic'}
  - !appx: {name: 'Microsoft.WindowsFeedbackHub*', type: family, option: 'apps-basic'}
  - !appx: {name: 'Microsoft.GetHelp*', type: family, option: 'apps-basic'}
  - !appx: {name: 'Microsoft.MicrosoftOfficeHub*', type: family, option: 'apps-basic'}        # "Microsoft 365" advertising hub
  - !appx: {name: 'Microsoft.PowerAutomateDesktop*', type: family, option: 'apps-basic'}
  - !appx: {name: 'Microsoft.Todos*', type: family, option: 'apps-basic'}
  - !appx: {name: 'Microsoft.ZuneVideo*', type: family, option: 'apps-basic'}                 # Films & TV
  - !appx: {name: 'microsoft.windowscommunicationsapps*', type: family, option: 'apps-basic'} # old Mail and Calendar
  - !appx: {name: 'MicrosoftCorporationII.MicrosoftFamily*', type: family, option: 'apps-basic'}
  - !appx: {name: 'Microsoft.YourPhone*', type: family, option: 'apps-basic'}                 # Phone Link (starts with Windows)
  # needs for phones
  #- !appx: {name: 'MicrosoftWindows.CrossDevice*', type: family, option: 'apps-basic'}        # "Mobile devices": keeps CrossDeviceService.exe running from startup
  - !appx: {name: 'MicrosoftWindows.Client.WebExperience*', type: family, option: 'apps-basic'} # Widgets
  - !appx: {name: 'Disney.37853FC22B2CE*', type: family, option: 'apps-basic'}                # sponsored stub
  - !appx: {name: '7EE7776C.LinkedInforWindows*', type: family, option: 'apps-basic'}         # sponsored stub
  - !appx: {name: 'Microsoft.Windows.AIHub*', type: family, option: 'apps-basic'}             # AI Hub (25H2/26H2 Copilot+ feature showcase)
  - !appx: {name: 'Microsoft.PCManager*', type: family, option: 'apps-basic'}                 # PC Manager ("cleaner", runs in the background)
  - !appx: {name: 'Microsoft.MicrosoftPCManager*', type: family, option: 'apps-basic'}
  - !appx: {name: 'Microsoft.M365Companions*', type: family, option: 'apps-basic'}            # Microsoft 365 companions (People/Files/Calendar, start with Windows)

  # Removed apps stay removed after a feature update (for example 25H2 -> 26H2): Windows does not provision a package
  # again when its family is listed under Deprovisioned. Undo deletes these keys, so the Store can bring the apps back.
  # Spotify is no longer removed: people install it on purpose, and its advertising in Start is already gone (the Start
  # pins are set by Set-StartPins.ps1). The return block earlier versions set is lifted.
  - !registryKey: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Appx\AppxAllUserStore\Deprovisioned\SpotifyAB.SpotifyMusic_zpdnekdrzrea0', operation: delete, errorAction: Ignore}
  - !registryKey: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Appx\AppxAllUserStore\Deprovisioned\clipchamp.clipchamp_yxz26nhyzhsrt', operation: add, option: 'apps-basic', errorAction: Log}
  - !registryKey: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Appx\AppxAllUserStore\Deprovisioned\Microsoft.BingNews_8wekyb3d8bbwe', operation: add, option: 'apps-basic', errorAction: Log}
  - !registryKey: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Appx\AppxAllUserStore\Deprovisioned\Microsoft.BingWeather_8wekyb3d8bbwe', operation: add, option: 'apps-basic', errorAction: Log}
  - !registryKey: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Appx\AppxAllUserStore\Deprovisioned\Microsoft.BingSearch_8wekyb3d8bbwe', operation: add, option: 'apps-basic', errorAction: Log}
  - !registryKey: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Appx\AppxAllUserStore\Deprovisioned\Microsoft.MicrosoftSolitaireCollection_8wekyb3d8bbwe', operation: add, option: 'apps-basic', errorAction: Log}
  - !registryKey: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Appx\AppxAllUserStore\Deprovisioned\MSTeams_8wekyb3d8bbwe', operation: add, option: 'apps-basic', errorAction: Log}
  - !registryKey: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Appx\AppxAllUserStore\Deprovisioned\MicrosoftTeams_8wekyb3d8bbwe', operation: add, option: 'apps-basic', errorAction: Log}
  - !registryKey: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Appx\AppxAllUserStore\Deprovisioned\Microsoft.Copilot_8wekyb3d8bbwe', operation: add, option: 'apps-basic', errorAction: Log}
  - !registryKey: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Appx\AppxAllUserStore\Deprovisioned\Microsoft.OutlookForWindows_8wekyb3d8bbwe', operation: add, option: 'apps-basic', errorAction: Log}
  - !registryKey: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Appx\AppxAllUserStore\Deprovisioned\Microsoft.Windows.DevHome_8wekyb3d8bbwe', operation: add, option: 'apps-basic', errorAction: Log}
  - !registryKey: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Appx\AppxAllUserStore\Deprovisioned\Microsoft.WindowsFeedbackHub_8wekyb3d8bbwe', operation: add, option: 'apps-basic', errorAction: Log}
  - !registryKey: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Appx\AppxAllUserStore\Deprovisioned\Microsoft.GetHelp_8wekyb3d8bbwe', operation: add, option: 'apps-basic', errorAction: Log}
  - !registryKey: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Appx\AppxAllUserStore\Deprovisioned\Microsoft.Getstarted_8wekyb3d8bbwe', operation: add, option: 'apps-basic', errorAction: Log}
  - !registryKey: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Appx\AppxAllUserStore\Deprovisioned\Microsoft.MicrosoftOfficeHub_8wekyb3d8bbwe', operation: add, option: 'apps-basic', errorAction: Log}
  - !registryKey: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Appx\AppxAllUserStore\Deprovisioned\Microsoft.PowerAutomateDesktop_8wekyb3d8bbwe', operation: add, option: 'apps-basic', errorAction: Log}
  - !registryKey: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Appx\AppxAllUserStore\Deprovisioned\Microsoft.Todos_8wekyb3d8bbwe', operation: add, option: 'apps-basic', errorAction: Log}
  - !registryKey: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Appx\AppxAllUserStore\Deprovisioned\Microsoft.ZuneVideo_8wekyb3d8bbwe', operation: add, option: 'apps-basic', errorAction: Log}
  - !registryKey: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Appx\AppxAllUserStore\Deprovisioned\Microsoft.549981C3F5F10_8wekyb3d8bbwe', operation: add, option: 'apps-basic', errorAction: Log}
  - !registryKey: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Appx\AppxAllUserStore\Deprovisioned\Microsoft.WindowsMaps_8wekyb3d8bbwe', operation: add, option: 'apps-basic', errorAction: Log}
  - !registryKey: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Appx\AppxAllUserStore\Deprovisioned\microsoft.windowscommunicationsapps_8wekyb3d8bbwe', operation: add, option: 'apps-basic', errorAction: Log}
  - !registryKey: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Appx\AppxAllUserStore\Deprovisioned\MicrosoftCorporationII.MicrosoftFamily_8wekyb3d8bbwe', operation: add, option: 'apps-basic', errorAction: Log}
  - !registryKey: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Appx\AppxAllUserStore\Deprovisioned\Microsoft.YourPhone_8wekyb3d8bbwe', operation: add, option: 'apps-basic', errorAction: Log}
  - !registryKey: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Appx\AppxAllUserStore\Deprovisioned\MicrosoftWindows.CrossDevice_cw5n1h2txyewy', operation: add, option: 'apps-basic', errorAction: Log}
  - !registryKey: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Appx\AppxAllUserStore\Deprovisioned\MicrosoftWindows.Client.WebExperience_cw5n1h2txyewy', operation: add, option: 'apps-basic', errorAction: Log}
  - !registryKey: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Appx\AppxAllUserStore\Deprovisioned\Disney.37853FC22B2CE_6rarf9sa4v8jt', operation: add, option: 'apps-basic', errorAction: Log}
  - !registryKey: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Appx\AppxAllUserStore\Deprovisioned\7EE7776C.LinkedInforWindows_w1wdnht996qgy', operation: add, option: 'apps-basic', errorAction: Log}
  - !registryKey: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Appx\AppxAllUserStore\Deprovisioned\Microsoft.Windows.AIHub_8wekyb3d8bbwe', operation: add, option: 'apps-basic', errorAction: Log}
  - !registryKey: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Appx\AppxAllUserStore\Deprovisioned\Microsoft.PCManager_8wekyb3d8bbwe', operation: add, option: 'apps-basic', errorAction: Log}
  - !registryKey: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Appx\AppxAllUserStore\Deprovisioned\Microsoft.MicrosoftPCManager_8wekyb3d8bbwe', operation: add, option: 'apps-basic', errorAction: Log}
  - !registryKey: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Appx\AppxAllUserStore\Deprovisioned\Microsoft.M365Companions_8wekyb3d8bbwe', operation: add, option: 'apps-basic', errorAction: Log}

  # Windows Update would bring Dev Home, Cross Device and the new Outlook back: these three keys are its to-do list for
  # that. They are deleted, not saved: "Undo Domain OS" does not create them again (Windows writes them again with
  # the next feature update).
  - !registryKey: {path: 'HKLM\SOFTWARE\Microsoft\WindowsUpdate\Orchestrator\UScheduler_Oobe\DevHomeUpdate', option: 'apps-basic', errorAction: Log}
  - !registryKey: {path: 'HKLM\SOFTWARE\Microsoft\WindowsUpdate\Orchestrator\UScheduler_Oobe\CrossDeviceUpdate', option: 'apps-basic', errorAction: Log}
  - !registryKey: {path: 'HKLM\SOFTWARE\Microsoft\WindowsUpdate\Orchestrator\UScheduler_Oobe\OutlookUpdate', option: 'apps-basic', errorAction: Log}

  # Windows installs "suggested" apps silently for every user: switched off.
  # Windows itself rewrites ContentDeliveryManager soon after sign-in and can drop these values (seen on 26H2 in
  # 2.1.9: written, gone 30 s later): [check: warn] marks them, so the final check warns instead of stopping.
  - !registryValue: {path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager', value: 'SilentInstalledAppsEnabled', data: '0', type: REG_DWORD, option: 'apps-basic', errorAction: Log}   # [check: warn]
  - !registryValue: {path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager', value: 'PreInstalledAppsEnabled', data: '0', type: REG_DWORD, option: 'apps-basic', errorAction: Log}   # [check: warn]
  - !registryValue: {path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager', value: 'PreInstalledAppsEverEnabled', data: '0', type: REG_DWORD, option: 'apps-basic', errorAction: Log}   # [check: warn]
  - !registryValue: {path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager', value: 'OemPreInstalledAppsEnabled', data: '0', type: REG_DWORD, option: 'apps-basic', errorAction: Log}   # [check: warn]
  - !registryValue: {path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager', value: 'ContentDeliveryAllowed', data: '0', type: REG_DWORD, option: 'apps-basic', errorAction: Log}   # [check: warn]
  - !registryValue: {path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager', value: 'RotatingLockScreenEnabled', data: '0', type: REG_DWORD, option: 'apps-basic', errorAction: Log}   # [check: warn]
  - !registryValue: {path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager', value: 'RotatingLockScreenOverlayEnabled', data: '0', type: REG_DWORD, option: 'apps-basic', errorAction: Log}   # [check: warn]
  - !registryValue: {path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager', value: 'SystemPaneSuggestionsEnabled', data: '0', type: REG_DWORD, option: 'apps-basic', errorAction: Log}   # [check: warn]
  - !registryValue: {path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager', value: 'SubscribedContent-310093Enabled', data: '0', type: REG_DWORD, option: 'apps-basic', errorAction: Log}   # [check: warn]
  - !registryValue: {path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager', value: 'SubscribedContent-310094Enabled', data: '0', type: REG_DWORD, option: 'apps-basic', errorAction: Log}   # [check: warn]
  - !registryValue: {path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager', value: 'SubscribedContent-338382Enabled', data: '0', type: REG_DWORD, option: 'apps-basic', errorAction: Log}   # [check: warn]
  - !registryValue: {path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager', value: 'SubscribedContent-338389Enabled', data: '0', type: REG_DWORD, option: 'apps-basic', errorAction: Log}   # [check: warn]
  - !registryValue: {path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager', value: 'SubscribedContent-338393Enabled', data: '0', type: REG_DWORD, option: 'apps-basic', errorAction: Log}   # [check: warn]
  - !registryValue: {path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager', value: 'SubscribedContent-353694Enabled', data: '0', type: REG_DWORD, option: 'apps-basic', errorAction: Log}   # [check: warn]
  - !registryValue: {path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager', value: 'SubscribedContent-353696Enabled', data: '0', type: REG_DWORD, option: 'apps-basic', errorAction: Log}   # [check: warn]
  - !registryValue: {path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager', value: 'SubscribedContent-88000325Enabled', data: '0', type: REG_DWORD, option: 'apps-basic', errorAction: Log}   # [check: warn]
  - !registryValue: {path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager', value: 'SubscribedContent-88000326Enabled', data: '0', type: REG_DWORD, option: 'apps-basic', errorAction: Log}   # [check: warn]

  # ---- OneDrive ---------------------------------------------------------------------------------------
  # Exit 1 (install stops) only when OneDrive's own uninstaller is there but cannot be started.
  - !run:
    exe: '%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe'
    args: '-NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\Remove-OneDrive.ps1"'
    runas: currentUserElevated
    exeDir: true
    wait: true
    weight: 20
    option: 'apps-onedrive'
    handleExitCodes: {'!0': Halt}

  # ---- maximum (off by default): the user gives up the Store and the Xbox app -------------------------
  - !appx: {name: 'Microsoft.GamingApp*', type: family, option: 'apps-max'}                   # Xbox app (Game Pass)
  - !appx: {name: 'Microsoft.Windows.Photos*', type: family, option: 'apps-max'}
  - !appx: {name: 'Microsoft.WindowsCamera*', type: family, option: 'apps-max'}
  - !appx: {name: 'Microsoft.WindowsSoundRecorder*', type: family, option: 'apps-max'}
  - !appx: {name: 'Microsoft.WindowsAlarms*', type: family, option: 'apps-max'}
  - !appx: {name: 'Microsoft.MicrosoftStickyNotes*', type: family, option: 'apps-max'}
