<?xml version="1.0" encoding="utf-8"?>
<Playbook>
	<Name>Domain OS</Name>
	<Username>Domain OS</Username>
	<Title>Domain OS 2.2.4</Title>
	<ShortDescription>Windows 11 built for games, every change documented</ShortDescription>
	<Description><![CDATA[Domain OS prepares Windows 11 (25H2, 26H2) for games and keeps it safe.

• Every change is documented: what it does and why it is there.
• Defender, Secure Boot, TPM and memory integrity are not touched, so anti-cheats keep working.
• Only changes with an effect that can be checked.

Before the first change the current state is saved. "Undo Domain OS" in the Start menu puts it back; removed apps are listed for you to install again from the Microsoft Store (the Store itself comes back automatically).

Windows 11 Pro only (on Home and other editions the install stops before any change). Runs on 25H2 and 26H2. 24H2 is not supported: Microsoft no longer issues security updates for it. On 24H2, update Windows first: Settings > Windows Update installs 25H2 or 26H2 as a small update with one restart.]]></Description>
	<Details>A short, documented list of changes for gaming on Windows 11 Pro, 25H2 and 26H2. Security components stay, anti-cheats keep working.</Details>
	<ProgressText><![CDATA[Domain OS is removing preinstalled apps, applying its documented settings and installing its tools. The computer will need a restart at the end.]]></ProgressText>
	<Version>2.2.4</Version>
	<SupportedBuilds>
		<string>26200</string>
		<string>26300</string>
	</SupportedBuilds>
	<Requirements>
		<Requirement>DefenderToggled</Requirement>
		<Requirement>PluggedIn</Requirement>
		<Requirement>Internet</Requirement>
	</Requirements>
	<UniqueId>5b5977ee-c186-4cd2-9ffc-ada1d412052a</UniqueId>
	<UpgradableFrom>any</UpgradableFrom>
	<AllowUnsupportedUpgrades>true</AllowUnsupportedUpgrades>
	<UseKernelDriver>false</UseKernelDriver>
	<EstimatedMinutes>10</EstimatedMinutes>
	<FeaturePages>
		<CheckboxPage IsRequired="true" Description="Tools that Domain OS installs. Each can be removed later like any program.">
			<Options>
				<CheckboxOption>
					<Text>Install the Domain OS app and start it with Windows</Text>
					<Name>install-scheduler</Name>
				</CheckboxOption>
				<CheckboxOption>
					<Text>Install Visual C++, DirectX runtime and 7-Zip</Text>
					<Name>install-runtimes</Name>
				</CheckboxOption>
				<CheckboxOption>
					<Text>Show the driver guide after the restart</Text>
					<Name>open-guide</Name>
				</CheckboxOption>
				<CheckboxOption>
					<Text>Domain OS wallpapers (desktop slideshow + lock screen)</Text>
					<Name>wallpaper</Name>
				</CheckboxOption>
			</Options>
		</CheckboxPage>
		<CheckboxPage IsRequired="true" Description="Windows Update: security updates always stay on. Choose what to switch off.">
			<Options>
				<CheckboxOption>
					<Text>Hold Windows on 26H2 (no further feature updates)</Text>
					<Name>updates-no-feature</Name>
				</CheckboxOption>
				<CheckboxOption>
					<Text>No drivers from Windows Update</Text>
					<Name>updates-no-drivers</Name>
				</CheckboxOption>
			</Options>
		</CheckboxPage>
		<CheckboxPage IsRequired="true" Description="Windows defaults: taskbar, theme, notifications and administrator prompts.">
			<Options>
				<CheckboxOption>
					<Text>Clean taskbar: only the Start button, no pins</Text>
					<Name>taskbar-clean</Name>
				</CheckboxOption>
				<CheckboxOption>
					<Text>Dark theme for Windows and apps</Text>
					<Name>ui-dark</Name>
				</CheckboxOption>
				<CheckboxOption IsChecked="false">
					<Text>Turn off all notifications</Text>
					<Name>ui-no-notifications</Name>
				</CheckboxOption>
				<CheckboxOption IsChecked="false">
					<Text>Administrator rights without the UAC prompt</Text>
					<Name>uac-no-prompt</Name>
				</CheckboxOption>
			</Options>
		</CheckboxPage>
		<CheckboxPage IsRequired="true" Description="Preinstalled apps. The Store, Xbox services and Edge stay unless you choose more.">
			<Options>
				<CheckboxOption>
					<Text>Remove preinstalled apps (news, Teams, Copilot, ...)</Text>
					<Name>apps-basic</Name>
				</CheckboxOption>
				<CheckboxOption>
					<Text>Remove OneDrive</Text>
					<Name>apps-onedrive</Name>
				</CheckboxOption>
				<CheckboxOption IsChecked="false">
					<Text>Maximum: also Store, Xbox app, Photos, Camera</Text>
					<Name>apps-max</Name>
				</CheckboxOption>
			</Options>
		</CheckboxPage>
		<CheckboxPage IsRequired="true" Description="Background jobs and file indexing. The second line removes a function.">
			<Options>
				<CheckboxOption>
					<Text>Unused jobs off, Edge does not stay in the background</Text>
					<Name>svc-basic</Name>
				</CheckboxOption>
				<CheckboxOption IsChecked="false">
					<Text>Switch off file indexing (file search gets slow)</Text>
					<Name>svc-search</Name>
				</CheckboxOption>
			</Options>
		</CheckboxPage>
		<CheckboxPage IsRequired="true" Description="Power, graphics and background apps. The first two are on by default.">
			<Options>
				<CheckboxOption>
					<Text>Domain OS power plan: Balanced, no USB and PCIe power saving</Text>
					<Name>power-plan</Name>
				</CheckboxOption>
				<CheckboxOption IsChecked="false">
					<Text>Switch off hibernation and Fast Startup</Text>
					<Name>hibernate-off</Name>
				</CheckboxOption>
				<CheckboxOption IsChecked="false">
					<Text>Store apps do not run in the background</Text>
					<Name>bg-apps</Name>
				</CheckboxOption>
			</Options>
		</CheckboxPage>
	</FeaturePages>
</Playbook>
