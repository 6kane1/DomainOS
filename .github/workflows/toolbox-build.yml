# Builds Domain OS Toolbox from the source in toolbox/ on GitHub's own machines, runs the tests and attests the
# exe: a signed statement (Sigstore) that this exact file was built by this workflow from this commit.
# Anyone can check a downloaded Toolbox:
#   gh attestation verify DomainScheduler.exe -R 6kane1/DomainOS
# With a release tag the exe is also attached to that release. The update-feed key and the tester key never come
# here: sealing test builds and signing feeds stay on the author's PC, done on the exe built and attested here.
name: Toolbox build (attested)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release to attach the exe to (empty: only a build artifact)"
        required: false
        default: ""
      asset_name:
        description: "File name in the release (empty: DomainScheduler-<version>.exe)"
        required: false
        default: ""

permissions:
  contents: write        # attach the exe to a release
  id-token: write        # Sigstore signing for the attestation
  attestations: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 8.0.x

      - name: Tests
        run: dotnet test toolbox/tests/DomainScheduler.Tests -c Release

      - name: Publish (self-contained single file, win-x64)
        run: >
          dotnet publish toolbox/src/DomainScheduler/DomainScheduler.csproj -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o out

      - name: Name and checksums
        id: meta
        shell: pwsh
        env:
          ASSET_NAME: ${{ inputs.asset_name }}      # inputs come in as data (env), never pasted into the script
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          foreach ($x in @($env:ASSET_NAME, $env:RELEASE_TAG)) {
            if ($x -and $x -notmatch '^[\w.\-]+$') { throw "Not allowed in release_tag / asset_name (letters, digits, . _ - only): $x" }
          }
          [xml]$p = Get-Content toolbox/Directory.Build.props
          $v = ($p.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1)
          $name = if ($env:ASSET_NAME) { $env:ASSET_NAME } else { "DomainScheduler-$v.exe" }
          Move-Item out/DomainScheduler.exe "out/$name"
          $h = (Get-FileHash "out/$name" -Algorithm SHA256).Hash.ToLower()
          "name=$name" >> $env:GITHUB_OUTPUT
          "version=$v" >> $env:GITHUB_OUTPUT
          "### Toolbox $v`n`n``$name`` SHA-256 ``$h```n`nCommit ${{ github.sha }}" >> $env:GITHUB_STEP_SUMMARY

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: out/${{ steps.meta.outputs.name }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: toolbox-${{ steps.meta.outputs.version }}
          path: out/${{ steps.meta.outputs.name }}
          retention-days: 30

      - name: Attach to the release
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          ASSET: out/${{ steps.meta.outputs.name }}
        shell: bash
        run: gh release upload "$RELEASE_TAG" "$ASSET" --clobber -R "$GITHUB_REPOSITORY"
