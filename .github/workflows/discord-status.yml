name: Discord status card
# The card in the Discord channel "00・status": version, members, website, when the bot last ran. Started by the bot's runs
# when the card is older than 25 minutes (GitHub's hourly cron below fires rarely and stays as a second way in), or
# by hand (Run workflow).
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: read      # when the Discord bot's workflow last ran
concurrency:
  group: discord-status
  cancel-in-progress: true
jobs:
  card:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/discord-status
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: pip install --quiet --require-hashes --only-binary=":all:" -r .github/discord-status/requirements.txt
      - run: python .github/discord-status/status.py
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          GH_TOKEN: ${{ github.token }}
