name: Discord bot (help commands, results charts)
# Short checks, not a bot that runs around the clock: every 10 minutes (cron) one run of about 2 minutes looks at the
# help discussions (! commands, first answers, calling the author) and the results forum (charts), pushes the numbers
# to the branch results-data (one commit, no history) and, when they changed, starts pages.yml to publish them. 
# Answers can therefore take up to ~10 minutes.
# The run is started from outside: a job on cron-job.org calls the workflow_dispatch API every 10 minutes with a
# fine-grained token that can only start Actions runs in this repository (GitHub's own cron below fires rarely for
# this repository and stays only as a second way in). The concurrency group makes runs wait for each other, so two
# never overlap and at most one waits. If the bot stops answering: check the cron-job.org job and the token's expiry.
# Each run also refreshes the status card (discord-status.yml) when it is older than 25 minutes.
# To stop the bot: disable the workflow. A run by hand: Actions → this workflow → Run workflow.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions: {}
concurrency:
  group: discord-bot
  cancel-in-progress: false
jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # push results/ to results-data (only the git commands get the token, see bot.py)
      actions: write    # start pages.yml when the results changed, and the status card when it is stale
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: results-data
          path: site
          persist-credentials: false
      - name: Git identity for the bot's pushes
        run: |
          git -C site config user.name "Domain OS bot"
          git -C site config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: pip install --quiet --require-hashes --only-binary=":all:" -r .github/discord-bot/requirements.txt
      - name: Bot check (~2 minutes)
        timeout-minutes: 6
        # attachments are read by a separate process as the user "nobody" with no tokens (bot.py --parse-worker)
        run: python .github/discord-bot/bot.py --watch 110
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          GH_PUSH_TOKEN: ${{ github.token }}
          RESULTS_JSON: site/results/results.json
      - name: Publish what is left (the bot already pushes every change right away)
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: python .github/discord-bot/bot.py --publish-only
        env:
          GH_PUSH_TOKEN: ${{ github.token }}
          RESULTS_JSON: site/results/results.json
      - name: Publish the site when the results changed
        if: ${{ !cancelled() && hashFiles('site/.published') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main -R "$GITHUB_REPOSITORY"
      - name: Refresh the status card when it is older than 25 minutes
        # GitHub's own cron for discord-status.yml fires rarely, so the bot's runs (every 5-10 minutes) start it.
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh run list -w discord-status.yml -L 1 --json createdAt -q '.[0].createdAt' -R "$GITHUB_REPOSITORY" || true)
          age=$(( $(date +%s) - $(date -d "${last:-1970-01-01T00:00:00Z}" +%s) ))
          if [ "$age" -gt 1500 ]; then
            echo "The status card is ${age} s old: refreshing it."
            gh workflow run discord-status.yml --ref main -R "$GITHUB_REPOSITORY"
          else
            echo "The status card is ${age} s old: fresh enough."
          fi
