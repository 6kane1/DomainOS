name: Discord bot (help commands, results charts)
# Runs in 30-minute shifts (a new one starts every 30 min): help discussions are checked every ~12 s
# (! commands, first answers, calling the author), the results forum every 5 min (charts);
# the numbers go to the site's results page (gh-pages: results/results.json) at the end of each shift.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: discord-bot
  cancel-in-progress: false
jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
          sparse-checkout: results
      - name: Git identity for the bot's pushes
        run: |
          git -C site config user.name "Domain OS bot"
          git -C site config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet pillow==11.0.0 py7zr==0.22.0
      - run: python .github/discord-bot/bot.py --watch 1740
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          RESULTS_JSON: site/results/results.json
      - name: Publish what is left (the bot already pushes every change right away)
        run: |
          cd site
          if [ -n "$(git status --porcelain results)" ]; then
            git config user.name "Domain OS bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add results/results.json && git commit -m "results: community benchmarks" && git push
          fi
