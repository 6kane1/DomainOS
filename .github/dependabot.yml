# Dependabot: a weekly look for updates of the pinned GitHub actions, the Toolbox's Rust crates (Cargo.lock) and the CI's pip
# packages; security updates come at once. Every update is an ordinary pull request: it must pass the whole test suite
# (main is protected) before it can be merged.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
  - package-ecosystem: cargo
    directories: [/toolbox/core, /toolbox/threadmap]
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    directories: [/tests, /.github/discord-status]
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
